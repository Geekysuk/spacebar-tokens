<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://send-fault-email-77052047925.europe-west2.run.app; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
<meta name="theme-color" content="#121113">
<meta name="robots" content="noindex">
<title>Spacebar tokens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
</head>
<body>
<div class="wrap">
  <div class="staff-hero">
    <img class="logo" src="./logo.svg" alt="Spacebar Arcade">
    <p>Token count</p>
  </div>

  <!-- Step 1: staff code -->
  <section id="step-staff" class="panel">
    <label for="staff">Your staff code</label>
    <input id="staff" class="code-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="····">
    <div id="staff-msg"></div>
    <button id="btn-staff" class="btn primary mt">Next</button>
  </section>

  <!-- Step 2: machine code -->
  <section id="step-machine" class="panel hidden">
    <div class="machine-card">
      <span class="name" id="who-name"></span>
      <a href="#" id="btn-switch" class="who">Not you?</a>
    </div>
    <label for="tag">Machine code (on the sticker)</label>
    <input id="tag" class="code-input" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="····">
    <div id="machine-msg"></div>
    <button id="btn-machine" class="btn primary mt">Next</button>
  </section>

  <!-- Step 3: count -->
  <section id="step-count" class="panel hidden">
    <div class="machine-card">
      <span class="name" id="m-name"></span>
      <span class="who" id="m-who"></span>
    </div>
    <div id="m-status" class="dim small" style="margin:-2px 0 10px"></div>
    <div id="fault-open" class="msg error hidden"></div>
    <label for="tokens">Tokens counted</label>
    <input id="tokens" class="count-input" type="number" inputmode="numeric" min="0" max="100000" placeholder="0">

    <label>Machine check</label>
    <div id="check-options"></div>
    <div id="fault-wrap" class="hidden">
      <label for="note">What's wrong?</label>
      <textarea id="note" maxlength="300" placeholder="e.g. joystick sticking, coin mech jammed, no sound"></textarea>
    </div>
    <div id="count-msg"></div>
    <button id="btn-save" class="btn primary mt">Log tokens</button>
    <button id="btn-back" class="btn quiet mt">Back</button>
  </section>

  <!-- Step 4: done -->
  <section id="step-done" class="panel hidden">
    <div class="done-big" id="done-n">0</div>
    <p class="done-sub" id="done-sub"></p>
    <div id="done-fault" class="msg info hidden">Fault reported — the machine's been flagged for repair.</div>
    <button id="btn-another" class="btn primary mt">Next machine</button>
    <button id="btn-finish" class="btn quiet mt">Finished</button>
  </section>

  <p class="dim small" style="text-align:center;margin-top:20px">Staff only. If your code doesn't work, ask Rob.</p>
</div>
<script type="module" src="staff.js"></script>
</body>
</html>
